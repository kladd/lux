[package]
name = "lux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# System clipboard read/write; image-data support
# isn't needed, text only.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# For OSC 52 clipboard payloads.
base64 = "0.22"
# Local wall-clock for the session status line.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.30"
# One-shot transitions: timed, eased, self-removing effects over the
# rendered frame.
tachyonfx = { version = "0.25", default-features = false, features = ["std", "std-duration"] }
# Detection rule matchers.
regex = "1"
# Unix plumbing for the server/client split: winsize ioctl on passed fds
#, setsid for daemonize, poll for
# interruptible client-input reads, uname for the status-line hostname
#.
rustix = { version = "1", features = ["termios", "process", "event", "system"] }
# SCM_RIGHTS fd passing over the attach socket.
sendfd = "0.4"
# Session persistence snapshots.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SIGWINCH relay in the client.
signal-hook = "0.4"
# Command line editing.
ratatui-textarea = "0.9"
# preserve_order: resolves duplicate key sequences to the
# last entry defined in the file, which requires file-order iteration.
toml = { version = "1", features = ["preserve_order"] }
# wezterm crates pinned to a single commit; termwiz must be
# the same rev because its types appear in wezterm-term's public API.
portable-pty = { git = "https://github.com/wezterm/wezterm", rev = "4fbd6b8e90e2326b8e25c589768f98bd71ddd047" }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "4fbd6b8e90e2326b8e25c589768f98bd71ddd047" }
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "4fbd6b8e90e2326b8e25c589768f98bd71ddd047" }
